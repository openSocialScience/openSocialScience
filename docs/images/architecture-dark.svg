<svg xmlns="http://www.w3.org/2000/svg" width="960" height="898" viewBox="0 0 960 898" role="img"
     aria-label="OpenSocialScience 的系统架构：宿主层、说明书层（Markdown，负责判断）、工具箱层（Python，负责确定性计算与通过检测）、外部依赖与产出目录。">
  <style>
    .sans { font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .mono { font-family: "SF Mono", ui-monospace, Menlo, "DejaVu Sans Mono", Consolas, monospace; }
  </style>
  <rect width="960" height="898" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="48" class="sans" font-size="23" font-weight="700" fill="#e6edf3">System Architecture</text>
  <text x="286" y="48" class="sans" font-size="17" fill="#8b949e">模型负责想，程序负责算和核</text>
  <text x="28" y="78" class="sans" font-size="13.5" fill="#6e7781">分界线只有一个问题：<tspan fill="#adbac7">这件事两次运行结果不一样，能不能接受？</tspan>不能接受的写成程序，可以有不同角度的留给说明书。</text>
  <text x="28" y="108" class="mono" font-size="12" letter-spacing="1.6" fill="#6e7781">宿主层 · HOST</text>
  <text x="936" y="108" class="sans" font-size="12.5" fill="#6e7781" text-anchor="end">oss install-skills 按宿主投影铺设；说明书本身不写死任何宿主</text>
  <rect x="24" y="118" width="912" height="66" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="48" y="135" width="118" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="107" y="156" class="mono" font-size="13" fill="#c9d1d9" text-anchor="middle">Claude Code</text>
  <rect x="178" y="135" width="118" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="237" y="156" class="mono" font-size="13" fill="#c9d1d9" text-anchor="middle">dsh</text>
  <rect x="308" y="135" width="118" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="367" y="156" class="mono" font-size="13" fill="#c9d1d9" text-anchor="middle">Codex</text>
  <rect x="438" y="135" width="118" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="497" y="156" class="mono" font-size="13" fill="#c9d1d9" text-anchor="middle">openclaw</text>
  <rect x="568" y="135" width="118" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="627" y="156" class="mono" font-size="13" fill="#c9d1d9" text-anchor="middle">WorkBuddy</text>
  <line x1="480" y1="184" x2="480" y2="219" stroke="#484f58" stroke-width="1.5"/>
  <path d="M475 219L485 219L480 226z" fill="#484f58"/>
  <text x="494" y="209" class="sans" font-size="12.5" fill="#6e7781">宿主加载说明书，按 manifest 一次只读当前环节的契约</text>
  <text x="28" y="216" class="mono" font-size="12" letter-spacing="1.6" fill="#6e7781">说明书层 · SKILLS（Markdown —— 判断）</text>
  <rect x="24" y="226" width="912" height="156" rx="10" fill="#161b22" stroke="#8957e5"/>
  <rect x="48" y="248" width="278" height="44" rx="6" fill="#0d1117" stroke="#8957e555"/>
  <text x="62" y="267" class="mono" font-size="13" fill="#d2a8ff">social-research</text>
  <text x="62" y="284" class="sans" font-size="12" fill="#8b949e">主链路由：九个环节的契约</text>
  <rect x="341" y="248" width="278" height="44" rx="6" fill="#0d1117" stroke="#8957e555"/>
  <text x="355" y="267" class="mono" font-size="13" fill="#d2a8ff">social-idea</text>
  <text x="355" y="284" class="sans" font-size="12" fill="#8b949e">找空白、想题目、陪审团</text>
  <rect x="634" y="248" width="278" height="44" rx="6" fill="#0d1117" stroke="#8957e555"/>
  <text x="648" y="267" class="mono" font-size="13" fill="#d2a8ff">social-identification</text>
  <text x="648" y="284" class="sans" font-size="12" fill="#8b949e">因果设计的审计</text>
  <rect x="48" y="304" width="278" height="44" rx="6" fill="#0d1117" stroke="#8957e555"/>
  <text x="62" y="323" class="mono" font-size="13" fill="#d2a8ff">social-paper</text>
  <text x="62" y="340" class="sans" font-size="12" fill="#8b949e">写稿：占位符、图、体例</text>
  <rect x="341" y="304" width="278" height="44" rx="6" fill="#0d1117" stroke="#8957e555"/>
  <text x="355" y="323" class="mono" font-size="13" fill="#d2a8ff">social-review</text>
  <text x="355" y="340" class="sans" font-size="12" fill="#8b949e">跨模型审稿与复审循环</text>
  <rect x="634" y="304" width="278" height="44" rx="6" fill="#0d1117" stroke="#8957e555"/>
  <text x="648" y="323" class="mono" font-size="13" fill="#d2a8ff">social-sim</text>
  <text x="648" y="340" class="sans" font-size="12" fill="#8b949e">仿真货箱的验收与入库</text>
  <text x="48" y="368" class="sans" font-size="12.5" fill="#6e7781">判断归说明书：这个空白值不值得填、处理时点是不是内生、引言怎么开头 —— 没有唯一正确答案的，写不成代码。</text>
  <line x1="480" y1="382" x2="480" y2="413" stroke="#484f58" stroke-width="1.5"/>
  <path d="M475 413L485 413L480 420z" fill="#484f58"/>
  <text x="494" y="405" class="sans" font-size="12.5" fill="#6e7781">说明书的每一步都落到一条 oss 命令上</text>
  <text x="28" y="410" class="mono" font-size="12" letter-spacing="1.6" fill="#6e7781">工具箱层 · oss（Python —— 确定性计算与通过检测）</text>
  <rect x="24" y="420" width="912" height="222" rx="10" fill="#161b22" stroke="#1f6feb"/>
  <rect x="48" y="440" width="278" height="44" rx="6" fill="#0d1117" stroke="#1f6feb55"/>
  <text x="62" y="459" class="mono" font-size="13" fill="#79c0ff">oss CLI</text>
  <text x="62" y="476" class="sans" font-size="12" fill="#8b949e">25 个命令组</text>
  <rect x="341" y="440" width="278" height="44" rx="6" fill="#0d1117" stroke="#1f6feb55"/>
  <text x="355" y="459" class="mono" font-size="13" fill="#79c0ff">Python API</text>
  <text x="355" y="476" class="sans" font-size="12" fill="#8b949e">oss/api/</text>
  <rect x="634" y="440" width="278" height="44" rx="6" fill="#0d1117" stroke="#1f6feb55"/>
  <text x="648" y="459" class="mono" font-size="13" fill="#79c0ff">MCP server</text>
  <text x="648" y="476" class="sans" font-size="12" fill="#8b949e">32 个工具，同一批函数</text>
  <rect x="48" y="500" width="864" height="70" rx="8" fill="#0d1117" stroke="#f0883e55"/>
  <text x="64" y="522" class="mono" font-size="12" letter-spacing="1.2" fill="#f0883e">通过检测 · CHECKS</text>
  <text x="64" y="544" class="sans" font-size="12.5" fill="#adbac7">锚点：换题要用户授权　·　探索：不许绕过 oss run　·　计划：列名必须真实存在</text>
  <text x="64" y="562" class="sans" font-size="12.5" fill="#adbac7">占位符：正文不许裸小数　·　研究类型：只许降级不许改大　·　审稿：同家族模型拒执行</text>
  <text x="48" y="588" class="mono" font-size="11.5" fill="#8b949e">core/   profiler · literature · reading · binding · power · analysis · staggered · discrete · figures · manuscript · style · loop</text>
  <text x="48" y="606" class="mono" font-size="11.5" fill="#8b949e">        merge · reshape · stack · datasources · datapacks · simbox · route · causal_checks · causal_wording · skillcheck</text>
  <text x="48" y="624" class="mono" font-size="11.5" fill="#8b949e">host/   reviewer（认十二个模型家族，同家族直接拒）　　gates/   anchor · explore · research_type</text>
  <line x1="480" y1="642" x2="480" y2="703" stroke="#484f58" stroke-width="1.5"/>
  <path d="M475 703L485 703L480 710z" fill="#484f58"/>
  <text x="494" y="680" class="sans" font-size="12.5" fill="#6e7781">拿外部数据与文献，把产物全部写进一个运行目录</text>
  <text x="28" y="700" class="mono" font-size="12" letter-spacing="1.6" fill="#6e7781">外部依赖 · EXTERNAL</text>
  <text x="600" y="700" class="mono" font-size="12" letter-spacing="1.6" fill="#6e7781">产出 · OUTPUT</text>
  <rect x="24" y="710" width="556" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="740" class="sans" font-size="12.5" fill="#6e7781">文献</text>
  <text x="88" y="740" class="sans" font-size="12.5" fill="#adbac7">OpenAlex · Semantic Scholar · Crossref（兜底解析）· Unpaywall / CORE（全文）</text>
  <text x="46" y="766" class="sans" font-size="12.5" fill="#6e7781">数据</text>
  <text x="88" y="766" class="sans" font-size="12.5" fill="#adbac7">世界银行 · OECD · Our World in Data · QoG / V-Dem / GSS 数据包 · 你自己的文件</text>
  <text x="46" y="792" class="sans" font-size="12.5" fill="#6e7781">审稿</text>
  <text x="88" y="792" class="sans" font-size="12.5" fill="#adbac7">任一 OpenAI 兼容端点 —— 必须不是执行模型的家族</text>
  <text x="46" y="818" class="sans" font-size="12.5" fill="#6e7781">导出</text>
  <text x="88" y="818" class="sans" font-size="12.5" fill="#adbac7">pandoc（→ .docx）· 风格包 styles/&lt;刊名&gt;/</text>
  <rect x="596" y="710" width="340" height="132" rx="10" fill="#161b22" stroke="#3fb95055"/>
  <text x="616" y="738" class="mono" font-size="11.5" fill="#8b949e">runs/&lt;运行目录&gt;/</text>
  <text x="616" y="756" class="mono" font-size="11.5" fill="#3fb950">  paper.docx</text>
  <text x="616" y="774" class="mono" font-size="11.5" fill="#8b949e">  paper.md · results.json</text>
  <text x="616" y="792" class="mono" font-size="11.5" fill="#8b949e">  plan.json · power.json</text>
  <text x="616" y="810" class="mono" font-size="11.5" fill="#8b949e">  review_*.json · route.json</text>
  <text x="616" y="828" class="mono" font-size="11.5" fill="#8b949e">  trace.jsonl</text>
  <text x="28" y="876" class="sans" font-size="13" fill="#6e7781">每一步都是三个动作：工具<tspan fill="#adbac7">算</tspan>出事实和候选 → 模型<tspan fill="#adbac7">判</tspan>哪个成立 → 工具再机械地<tspan fill="#adbac7">回验</tspan>这个判断。回验是这套设计的关键。</text>
</svg>
